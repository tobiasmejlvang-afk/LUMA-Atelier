<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101116">
  <meta name="description" content="LUMA Atelier. Dit arbejdsrum til import, fremkaldelse, design og fremvisning af fotografier.">
  <title>LUMA Atelier</title>
  <link rel="icon" href="./assets/luma-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./creative.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Spring til arbejdsrum</a>
  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar" aria-label="Arbejdsrum"></aside>
    <div class="main-shell">
      <header class="topbar" id="topbar"></header>
      <main class="workspace" id="main" tabindex="-1" aria-label="Indhold">
        <div class="startup"><span class="brand-mark" aria-hidden="true">✳</span><p>Åbner LUMA Atelier …</p></div>
      </main>
      <footer class="footer" id="footer"></footer>
    </div>
  </div>
  <input id="import-files" type="file" multiple accept="image/*,.dng,.cr2,.cr3,.nef,.arw,.raf,.rw2,.orf,.tif,.tiff" hidden>
  <input id="import-folder" type="file" webkitdirectory multiple hidden>
  <input id="restore-file" type="file" accept=".luma,.json,application/json,application/octet-stream" hidden>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
